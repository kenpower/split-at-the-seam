name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Catcher unit tests (no SFML)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCATCHER_BUILD_GAMES=OFF

      - name: Build tests
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
